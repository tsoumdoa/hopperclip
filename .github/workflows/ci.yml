name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm exec vitest run
      - run: pnpm run build
        env:
          CLERK_SECRET_KEY: sk_test_dummy
          R2_ACCESS_KEY_ID: dummy
          R2_SECRET_ACCESS_KEY: dummy
          R2_URL: https://example.r2.cloudflarestorage.com
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
          VITE_CONVEX_URL: https://example.convex.cloud
          VITE_POSTHOG_KEY: dummy
          VITE_POSTHOG_HOST: https://us.i.posthog.com
          VITE_HOSTING_DOMAIN: https://example.com
  audit-pnpm:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
      - run: pnpm audit --audit-level moderate

  audit-bun:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Audit parser sandbox dependencies
        working-directory: parser/sand
        run: bun audit --audit-level moderate
